services:
  app:
    build: .
    ports:
      - "127.0.0.1:${CHALLENGECHAIN_PORT:-8080}:80"
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${DOCKER_APP_URL:-http://localhost:8080}
      DB_PATH: /var/www/html/storage/database.sqlite
    volumes:
      - challengechain_storage:/var/www/html/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  challengechain_storage:
